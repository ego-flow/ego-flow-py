name: CI

on:
  push:
    branches: [main, v0.0.1]
  pull_request:
    branches: [main, v0.0.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and release tools
        run: python -m pip install -e ".[test,release]" ruff==0.16.4 mypy==2.3.1

      - name: Run tests and quality checks
        run: |
          python -m pytest
          python -m ruff check src tests
          python -m mypy src

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*

  supply-chain:
    name: Secrets and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the release tree for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

      - name: Install verified CycloneDX CLI
        env:
          CYCLONEDX_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          binary="$RUNNER_TEMP/cyclonedx"
          curl -fsSL "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64" -o "$binary"
          echo "${CYCLONEDX_SHA256}  ${binary}" | sha256sum --check
          chmod +x "$binary"

      - name: Recreate deterministic package SBOM
        env:
          CYCLONEDX_BIN: ${{ runner.temp }}/cyclonedx
        run: ./tools/generate-sbom.sh

      - name: Ensure the committed SBOM is current
        run: git diff --exit-code -- sbom.cdx.json

      - name: Validate committed CycloneDX 1.6 SBOM
        run: |
          "$RUNNER_TEMP/cyclonedx" validate --input-file sbom.cdx.json --input-format json --input-version v1_6 --fail-on-errors

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require a sign-off on every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          while read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Missing DCO sign-off: $commit"
              failed=1
            fi
          done < <(git rev-list "${BASE_SHA}..HEAD")
          exit "$failed"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block vulnerable or restricted new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, BUSL-1.1, SSPL-1.0
