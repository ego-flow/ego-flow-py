name: Feature request
description: Propose an EgoFlow Python Client improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Python/server compatibility and migration impact
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: New dependencies or data handling
      description: List sources, versions, licenses, purposes, and security/privacy impact, or state none.
    validations:
      required: true
