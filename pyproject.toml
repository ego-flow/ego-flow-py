[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-flow"
dynamic = ["version"]
description = "Python dataset and live-stream client for EgoFlow servers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "EgoFlow"},
]
requires-python = ">=3.9"
keywords = ["egocentric-video", "datasets", "video", "hls", "machine-learning"]
dependencies = [
  "av>=12.0",
  "datasets>=2.19",
  "numpy>=1.23",
  "platformdirs>=4.0",
  "torch>=2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ego-flow/ego-flow-py"
Repository = "https://github.com/ego-flow/ego-flow-py"
Issues = "https://github.com/ego-flow/ego-flow-py/issues"
Changelog = "https://github.com/ego-flow/ego-flow-py/blob/main/CHANGELOG.md"
"Code of Conduct" = "https://github.com/ego-flow/ego-flow-py/blob/main/CODE_OF_CONDUCT.md"
Contributing = "https://github.com/ego-flow/ego-flow-py/blob/main/CONTRIBUTING.md"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
release = [
  "build>=1.2",
  "twine>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ego_flow._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ego_flow = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
